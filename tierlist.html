<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tierlists</title>
<style>
  :root {
    --navy: #1e2d40;
    --cream: #faf8f4;
    --sand: #f0ede6;
    --border: #e2ddd6;
    --muted: #8a8480;
    --accent: #c17b3f;
    --accent-light: #fdf0e4;
    --red: #c0392b;
    --green: #2d7a4f;
    --tier-s: #e8453c;
    --tier-a: #e8843c;
    --tier-b: #d4b84a;
    --tier-c: #5aab6e;
    --tier-d: #4a7fc1;
    --tier-e: #8e6bbf;
    --shadow: 0 2px 12px rgba(30,45,64,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--cream); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--navy); min-height: 100vh; }

  /* ── HEADER ── */
  .header { background: var(--navy); color: white; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .header-btns { display: flex; gap: 8px; }
  .btn-header { background: rgba(255,255,255,0.12); border: none; color: white; padding: 6px 12px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btn-header:hover { background: rgba(255,255,255,0.2); }

  /* ── LIST SELECTOR ── */
  .list-bar { background: white; border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; gap: 8px; overflow-x: auto; align-items: center; }
  .list-bar::-webkit-scrollbar { display: none; }
  .list-chip { padding: 6px 14px; border-radius: 99px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: white; color: var(--muted); white-space: nowrap; transition: all 0.15s; }
  .list-chip.active { background: var(--navy); color: white; border-color: var(--navy); }
  .list-chip:hover:not(.active) { border-color: var(--navy); color: var(--navy); }
  .list-chip.add-chip { color: var(--accent); border-color: var(--accent); border-style: dashed; }

  /* ── MAIN ── */
  .main { max-width: 680px; margin: 0 auto; padding: 16px; }

  /* ── LIST HEADER ── */
  .list-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .list-title { font-size: 20px; font-weight: 800; color: var(--navy); flex: 1; background: none; border: none; outline: none; font-family: inherit; }
  .list-title:focus { border-bottom: 2px solid var(--accent); }
  .list-desc { font-size: 13px; color: var(--muted); margin-bottom: 16px; margin-top: -10px; background: none; border: none; outline: none; width: 100%; font-family: inherit; }
  .list-desc:focus { border-bottom: 1px solid var(--border); }

  /* ── TIER ── */
  .tier { background: white; border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
  .tier-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer; }
  .tier-colour { width: 32px; height: 32px; border-radius: 8px; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0; }
  .tier-name-input { font-size: 14px; font-weight: 700; background: none; border: none; outline: none; color: var(--navy); font-family: inherit; flex: 1; cursor: pointer; }
  .tier-name-input:focus { cursor: text; }
  .tier-count { font-size: 11px; color: var(--muted); font-weight: 600; }
  .tier-chev { font-size: 11px; color: var(--muted); transition: transform 0.2s; }
  .tier-body { padding: 0 12px 12px; display: none; }
  .tier-body.open { display: block; }
  .tier-actions { display: flex; gap: 6px; padding: 0 12px 10px; flex-wrap: wrap; }

  /* ── ITEMS ── */
  .items-grid { display: flex; flex-direction: column; gap: 6px; min-height: 40px; }
  .item-card { background: var(--sand); border-radius: 10px; padding: 10px 12px; display: flex; align-items: flex-start; gap: 10px; cursor: grab; border: 1.5px solid transparent; transition: all 0.15s; }
  .item-card:active { cursor: grabbing; opacity: 0.7; }
  .item-card.drag-over { border-color: var(--accent); background: var(--accent-light); }
  .item-card.dragging { opacity: 0.4; }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 13px; font-weight: 700; color: var(--navy); }
  .item-notes { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; white-space: pre-wrap; }
  .item-tag { display: inline-block; font-size: 10px; background: var(--border); color: var(--muted); border-radius: 99px; padding: 1px 7px; margin-top: 4px; font-weight: 600; }
  .item-btns { display: flex; gap: 4px; flex-shrink: 0; }
  .btn-xs { background: none; border: 1px solid var(--border); color: var(--muted); padding: 3px 7px; border-radius: 6px; font-size: 11px; cursor: pointer; }
  .btn-xs:hover { background: var(--border); color: var(--navy); }
  .btn-danger-xs { background: none; border: 1px solid #fcc; color: var(--red); padding: 3px 7px; border-radius: 6px; font-size: 11px; cursor: pointer; }
  .btn-danger-xs:hover { background: #fdd; }
  .drop-zone { min-height: 36px; border: 2px dashed var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); transition: all 0.15s; }
  .drop-zone.drag-over { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }

  /* ── BUTTONS ── */
  .btn-sm { background: white; border: 1.5px solid var(--border); color: var(--navy); padding: 5px 11px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btn-sm:hover { border-color: var(--navy); }
  .btn-primary { background: var(--navy); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-accent { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }

  /* ── MODALS ── */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: white; border-radius: 20px 20px 0 0; padding: 20px 18px 32px; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; }
  .modal h3 { font-size: 16px; font-weight: 800; margin-bottom: 14px; color: var(--navy); }
  label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin: 10px 0 4px; }
  input[type=text], textarea, select { width: 100%; padding: 9px 11px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; color: var(--navy); background: white; outline: none; }
  input[type=text]:focus, textarea:focus, select:focus { border-color: var(--navy); }
  textarea { min-height: 80px; resize: vertical; }
  .modal-btns { display: flex; gap: 8px; margin-top: 16px; }
  .btn-cancel { background: var(--sand); border: none; color: var(--muted); padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }

  /* ── COLOUR PICKER ── */
  .colour-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .colour-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: all 0.15s; }
  .colour-dot.selected { border-color: var(--navy); transform: scale(1.2); }

  /* ── EMPTY ── */
  .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }
  .empty-state .big { font-size: 36px; margin-bottom: 10px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  /* ── MOVE MENU ── */
  .move-menu { position: absolute; background: white; border: 1.5px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; z-index: 300; min-width: 160px; }
  .move-option { padding: 7px 11px; font-size: 13px; cursor: pointer; border-radius: 6px; display: flex; align-items: center; gap: 8px; }
  .move-option:hover { background: var(--sand); }

  @media (min-width: 480px) {
    .overlay { align-items: center; }
    .modal { border-radius: 16px; margin: 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📊 Tierlists</h1>
  <div class="header-btns">
    <button class="btn-header" onclick="openNewList()">+ New list</button>
  </div>
</div>

<div class="list-bar" id="list-bar"></div>

<div class="main" id="main-content">
  <div class="empty-state">
    <div class="big">📊</div>
    <p>Create your first tierlist.<br/>People, books, commitments — anything you want to rank and track over time.</p>
    <br/>
    <button class="btn-primary" onclick="openNewList()">+ New list</button>
  </div>
</div>

<!-- Move menu (floating) -->
<div id="move-menu" class="move-menu" style="display:none;"></div>

<!-- New/Edit List Modal -->
<div class="overlay" id="list-modal" onclick="closeListModal(event)">
  <div class="modal">
    <h3 id="list-modal-title">New list</h3>
    <label>Name</label>
    <input type="text" id="lm-name" placeholder="e.g. Ministry investment, Books, Commitments..." />
    <label>Description (optional)</label>
    <input type="text" id="lm-desc" placeholder="What is this list for?" />
    <div class="modal-btns">
      <button class="btn-primary" style="flex:2" onclick="saveList()">Save</button>
      <button class="btn-cancel" onclick="closeListModalDirect()">Cancel</button>
      <button id="lm-delete" class="btn-danger-xs" style="display:none;padding:8px 12px;" onclick="deleteList()">Delete list</button>
    </div>
  </div>
</div>

<!-- New/Edit Item Modal -->
<div class="overlay" id="item-modal" onclick="closeItemModal(event)">
  <div class="modal">
    <h3 id="item-modal-title">Add item</h3>
    <label>Name</label>
    <input type="text" id="im-name" placeholder="e.g. Dom, Knowing God, Weekly prayer meeting..." />
    <label>Notes</label>
    <textarea id="im-notes" placeholder="Context, why they're here, what you want to remember..."></textarea>
    <label>Tag (optional)</label>
    <input type="text" id="im-tag" placeholder="e.g. Year 13, Book, Ministry" />
    <label>Tier</label>
    <select id="im-tier"></select>
    <div class="modal-btns">
      <button class="btn-primary" style="flex:2" onclick="saveItem()">Save</button>
      <button class="btn-cancel" onclick="closeItemModalDirect()">Cancel</button>
      <button id="im-delete" class="btn-danger-xs" style="display:none;padding:8px 12px;" onclick="deleteItem()">Delete</button>
    </div>
  </div>
</div>

<!-- New/Edit Tier Modal -->
<div class="overlay" id="tier-modal" onclick="closeTierModal(event)">
  <div class="modal">
    <h3 id="tier-modal-title">Add tier</h3>
    <label>Tier name</label>
    <input type="text" id="tm-name" placeholder="e.g. Daily, High priority, Dormant..." />
    <label>Colour</label>
    <div class="colour-row" id="tm-colours"></div>
    <div class="modal-btns">
      <button class="btn-primary" style="flex:2" onclick="saveTier()">Save</button>
      <button class="btn-cancel" onclick="closeTierModalDirect()">Cancel</button>
      <button id="tm-delete" class="btn-danger-xs" style="display:none;padding:8px 12px;" onclick="deleteTier()">Delete tier</button>
    </div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────────
const COLOURS = ['#e8453c','#e8843c','#d4b84a','#5aab6e','#4a7fc1','#8e6bbf','#e8529e','#3ba8a8','#1e2d40','#8a8480'];

let state = { lists: [], activeList: null };
let dragItem = null, dragFromTier = null;
let editListId = null, editItemId = null, editTierId = null, editItemListId = null;
let selectedColour = COLOURS[0];

// ── STORAGE ───────────────────────────────────────────────────────────────────
function load() {
  try { const s = JSON.parse(localStorage.getItem('tl-state') || 'null'); if (s) state = s; } catch(e) {}
}
function save() { try { localStorage.setItem('tl-state', JSON.stringify(state)); } catch(e) {} }

function getList(id) { return state.lists.find(l => l.id === id); }
function getTier(list, id) { return list.tiers.find(t => t.id === id); }

// ── IDS ───────────────────────────────────────────────────────────────────────
function uid() { return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

// ── RENDER ────────────────────────────────────────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render() {
  renderListBar();
  const list = state.activeList ? getList(state.activeList) : null;
  if (!list) {
    document.getElementById('main-content').innerHTML = `
      <div class="empty-state">
        <div class="big">📊</div>
        <p>Create your first tierlist.<br/>People, books, commitments — anything you want to rank over time.</p>
        <br/><button class="btn-primary" onclick="openNewList()">+ New list</button>
      </div>`;
    return;
  }
  renderList(list);
}

function renderListBar() {
  const bar = document.getElementById('list-bar');
  bar.innerHTML = state.lists.map(l =>
    `<div class="list-chip${state.activeList===l.id?' active':''}" onclick="setActiveList('${l.id}')">${esc(l.name)}</div>`
  ).join('') + `<div class="list-chip add-chip" onclick="openNewList()">+ New</div>`;
}

function renderList(list) {
  const mc = document.getElementById('main-content');
  mc.innerHTML = `
    <div class="list-header">
      <input class="list-title" value="${esc(list.name)}" onblur="renameList('${list.id}',this.value)" onkeydown="if(event.key==='Enter')this.blur()" />
      <button class="btn-sm" onclick="openEditList('${list.id}')">⚙️</button>
    </div>
    <input class="list-desc" value="${esc(list.desc||'')}" placeholder="Add a description..." onblur="redescList('${list.id}',this.value)" onkeydown="if(event.key==='Enter')this.blur()" />
    <div id="tiers-container">
      ${list.tiers.map(t => renderTier(list, t)).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-top:4px;">
      <button class="btn-sm" onclick="openNewTier('${list.id}')">+ Add tier</button>
      <button class="btn-accent" onclick="openNewItem('${list.id}')">+ Add item</button>
    </div>
  `;
}

function renderTier(list, tier) {
  const items = list.items.filter(i => i.tierId === tier.id);
  const open = tier.open !== false;
  return `
    <div class="tier" id="tier-${tier.id}">
      <div class="tier-head" onclick="toggleTier('${list.id}','${tier.id}')">
        <div class="tier-colour" style="background:${tier.colour}">${esc(tier.name[0]||'?')}</div>
        <input class="tier-name-input" value="${esc(tier.name)}"
          onclick="event.stopPropagation()"
          onblur="renameTier('${list.id}','${tier.id}',this.value)"
          onkeydown="if(event.key==='Enter')this.blur();event.stopPropagation();" />
        <span class="tier-count">${items.length} item${items.length===1?'':'s'}</span>
        <span class="tier-chev" id="chev-${tier.id}" style="transform:${open?'rotate(0)':'rotate(-90deg)'}">▼</span>
      </div>
      <div class="tier-body${open?' open':''}" id="tbody-${tier.id}"
        ondragover="dragOver(event,'${tier.id}')"
        ondrop="drop(event,'${list.id}','${tier.id}')">
        <div class="items-grid" id="items-${tier.id}">
          ${items.length ? items.map(i => renderItem(list, tier, i)).join('') : `<div class="drop-zone" id="dz-${tier.id}" ondragover="dzOver(event,'${tier.id}')" ondrop="drop(event,'${list.id}','${tier.id}')">Drop items here</div>`}
        </div>
      </div>
      <div class="tier-actions${open?'':' open'}">
        <button class="btn-sm" onclick="openNewItem('${list.id}','${tier.id}')">+ Item</button>
        <button class="btn-sm" onclick="openEditTier('${list.id}','${tier.id}')">✏️ Tier</button>
      </div>
    </div>`;
}

function renderItem(list, tier, item) {
  return `<div class="item-card" draggable="true" id="item-${item.id}"
    ondragstart="dragStart(event,'${item.id}','${tier.id}')"
    ondragend="dragEnd(event)">
    <div class="item-info">
      <div class="item-name">${esc(item.name)}</div>
      ${item.notes ? `<div class="item-notes">${esc(item.notes)}</div>` : ''}
      ${item.tag ? `<span class="item-tag">${esc(item.tag)}</span>` : ''}
    </div>
    <div class="item-btns">
      <button class="btn-xs" onclick="openMoveMenu(event,'${list.id}','${item.id}','${tier.id}')">↕</button>
      <button class="btn-xs" onclick="openEditItem('${list.id}','${item.id}')">✏️</button>
    </div>
  </div>`;
}

// ── LISTS ─────────────────────────────────────────────────────────────────────
function setActiveList(id) { state.activeList = id; save(); render(); }

function openNewList() {
  editListId = null;
  document.getElementById('lm-name').value = '';
  document.getElementById('lm-desc').value = '';
  document.getElementById('list-modal-title').textContent = 'New list';
  document.getElementById('lm-delete').style.display = 'none';
  document.getElementById('list-modal').classList.add('open');
  setTimeout(() => document.getElementById('lm-name').focus(), 100);
}

function openEditList(id) {
  const list = getList(id);
  editListId = id;
  document.getElementById('lm-name').value = list.name;
  document.getElementById('lm-desc').value = list.desc || '';
  document.getElementById('list-modal-title').textContent = 'Edit list';
  document.getElementById('lm-delete').style.display = 'block';
  document.getElementById('list-modal').classList.add('open');
}

function saveList() {
  const name = document.getElementById('lm-name').value.trim();
  if (!name) return;
  const desc = document.getElementById('lm-desc').value.trim();
  if (editListId) {
    const list = getList(editListId);
    list.name = name; list.desc = desc;
  } else {
    const id = uid();
    state.lists.push({
      id, name, desc,
      tiers: [
        { id: uid(), name: 'S', colour: '#e8453c', open: true },
        { id: uid(), name: 'A', colour: '#e8843c', open: true },
        { id: uid(), name: 'B', colour: '#d4b84a', open: true },
        { id: uid(), name: 'C', colour: '#5aab6e', open: true },
        { id: uid(), name: 'D', colour: '#4a7fc1', open: true },
      ],
      items: []
    });
    state.activeList = id;
  }
  save(); closeListModalDirect(); render();
}

function deleteList() {
  if (!editListId) return;
  if (!confirm('Delete this list and all its items?')) return;
  state.lists = state.lists.filter(l => l.id !== editListId);
  if (state.activeList === editListId) state.activeList = state.lists[0]?.id || null;
  save(); closeListModalDirect(); render();
}

function renameList(id, val) {
  const list = getList(id); if (!list || !val.trim()) return;
  list.name = val.trim(); save(); renderListBar();
}
function redescList(id, val) {
  const list = getList(id); if (!list) return;
  list.desc = val.trim(); save();
}

function closeListModal(e) { if (e.target === document.getElementById('list-modal')) closeListModalDirect(); }
function closeListModalDirect() { document.getElementById('list-modal').classList.remove('open'); editListId = null; }

// ── TIERS ─────────────────────────────────────────────────────────────────────
function toggleTier(listId, tierId) {
  const list = getList(listId); const tier = getTier(list, tierId);
  tier.open = !tier.open; save();
  const body = document.getElementById('tbody-' + tierId);
  const chev = document.getElementById('chev-' + tierId);
  if (body) body.classList.toggle('open', tier.open);
  if (chev) chev.style.transform = tier.open ? 'rotate(0)' : 'rotate(-90deg)';
}

function openNewTier(listId) {
  editTierId = null; editItemListId = listId;
  selectedColour = COLOURS[0];
  document.getElementById('tm-name').value = '';
  document.getElementById('tier-modal-title').textContent = 'Add tier';
  document.getElementById('tm-delete').style.display = 'none';
  renderColourPicker();
  document.getElementById('tier-modal').classList.add('open');
  setTimeout(() => document.getElementById('tm-name').focus(), 100);
}

function openEditTier(listId, tierId) {
  const list = getList(listId); const tier = getTier(list, tierId);
  editTierId = tierId; editItemListId = listId;
  selectedColour = tier.colour;
  document.getElementById('tm-name').value = tier.name;
  document.getElementById('tier-modal-title').textContent = 'Edit tier';
  document.getElementById('tm-delete').style.display = 'block';
  renderColourPicker();
  document.getElementById('tier-modal').classList.add('open');
}

function renderColourPicker() {
  document.getElementById('tm-colours').innerHTML = COLOURS.map(c =>
    `<div class="colour-dot${c===selectedColour?' selected':''}" style="background:${c}" onclick="selectColour('${c}')"></div>`
  ).join('');
}

function selectColour(c) {
  selectedColour = c;
  document.querySelectorAll('.colour-dot').forEach(d => d.classList.toggle('selected', d.style.background === c || d.style.backgroundColor === c));
}

function saveTier() {
  const name = document.getElementById('tm-name').value.trim();
  if (!name) return;
  const list = getList(editItemListId);
  if (editTierId) {
    const tier = getTier(list, editTierId);
    tier.name = name; tier.colour = selectedColour;
  } else {
    list.tiers.push({ id: uid(), name, colour: selectedColour, open: true });
  }
  save(); closeTierModalDirect(); render();
}

function deleteTier() {
  if (!editTierId) return;
  const list = getList(editItemListId);
  if (list.items.some(i => i.tierId === editTierId)) {
    if (!confirm('This tier has items. Delete tier and move items to the first tier?')) return;
    const firstTier = list.tiers.find(t => t.id !== editTierId);
    list.items.forEach(i => { if (i.tierId === editTierId) i.tierId = firstTier?.id || null; });
  }
  list.tiers = list.tiers.filter(t => t.id !== editTierId);
  save(); closeTierModalDirect(); render();
}

function renameTier(listId, tierId, val) {
  const list = getList(listId); const tier = getTier(list, tierId);
  if (!tier || !val.trim()) return;
  tier.name = val.trim(); save();
  const dot = document.querySelector(`#tier-${tierId} .tier-colour`);
  if (dot) dot.textContent = val.trim()[0] || '?';
}

function closeTierModal(e) { if (e.target === document.getElementById('tier-modal')) closeTierModalDirect(); }
function closeTierModalDirect() { document.getElementById('tier-modal').classList.remove('open'); editTierId = null; }

// ── ITEMS ─────────────────────────────────────────────────────────────────────
function openNewItem(listId, tierId) {
  editItemId = null; editItemListId = listId;
  document.getElementById('im-name').value = '';
  document.getElementById('im-notes').value = '';
  document.getElementById('im-tag').value = '';
  document.getElementById('item-modal-title').textContent = 'Add item';
  document.getElementById('im-delete').style.display = 'none';
  populateTierSelect(listId, tierId);
  document.getElementById('item-modal').classList.add('open');
  setTimeout(() => document.getElementById('im-name').focus(), 100);
}

function openEditItem(listId, itemId) {
  const list = getList(listId);
  const item = list.items.find(i => i.id === itemId);
  editItemId = itemId; editItemListId = listId;
  document.getElementById('im-name').value = item.name;
  document.getElementById('im-notes').value = item.notes || '';
  document.getElementById('im-tag').value = item.tag || '';
  document.getElementById('item-modal-title').textContent = 'Edit item';
  document.getElementById('im-delete').style.display = 'block';
  populateTierSelect(listId, item.tierId);
  document.getElementById('item-modal').classList.add('open');
}

function populateTierSelect(listId, selectedTierId) {
  const list = getList(listId);
  const sel = document.getElementById('im-tier');
  sel.innerHTML = list.tiers.map(t =>
    `<option value="${t.id}"${t.id===selectedTierId?' selected':''}>${esc(t.name)}</option>`
  ).join('');
}

function saveItem() {
  const name = document.getElementById('im-name').value.trim();
  if (!name) return;
  const notes = document.getElementById('im-notes').value.trim();
  const tag = document.getElementById('im-tag').value.trim();
  const tierId = document.getElementById('im-tier').value;
  const list = getList(editItemListId);
  if (editItemId) {
    const item = list.items.find(i => i.id === editItemId);
    item.name = name; item.notes = notes; item.tag = tag; item.tierId = tierId;
  } else {
    list.items.push({ id: uid(), name, notes, tag, tierId });
  }
  save(); closeItemModalDirect(); render();
}

function deleteItem() {
  if (!editItemId) return;
  if (!confirm('Delete this item?')) return;
  const list = getList(editItemListId);
  list.items = list.items.filter(i => i.id !== editItemId);
  save(); closeItemModalDirect(); render();
}

function closeItemModal(e) { if (e.target === document.getElementById('item-modal')) closeItemModalDirect(); }
function closeItemModalDirect() { document.getElementById('item-modal').classList.remove('open'); editItemId = null; }

// ── MOVE MENU ─────────────────────────────────────────────────────────────────
function openMoveMenu(e, listId, itemId, currentTierId) {
  e.stopPropagation();
  const list = getList(listId);
  const menu = document.getElementById('move-menu');
  menu.innerHTML = `<div style="font-size:10px;font-weight:700;color:var(--muted);padding:4px 11px 6px;text-transform:uppercase;letter-spacing:0.05em;">Move to tier</div>` +
    list.tiers.filter(t => t.id !== currentTierId).map(t =>
      `<div class="move-option" onclick="moveItem('${listId}','${itemId}','${t.id}')">
        <div style="width:14px;height:14px;border-radius:3px;background:${t.colour};flex-shrink:0;"></div>
        ${esc(t.name)}
      </div>`
    ).join('');
  const rect = e.currentTarget.getBoundingClientRect();
  menu.style.display = 'block';
  menu.style.top = (rect.bottom + window.scrollY + 4) + 'px';
  menu.style.left = Math.min(rect.left, window.innerWidth - 180) + 'px';
  setTimeout(() => document.addEventListener('click', closeMoveMenu, { once: true }), 0);
}

function closeMoveMenu() { document.getElementById('move-menu').style.display = 'none'; }

function moveItem(listId, itemId, newTierId) {
  const list = getList(listId);
  const item = list.items.find(i => i.id === itemId);
  item.tierId = newTierId;
  save(); closeMoveMenu(); render();
}

// ── DRAG & DROP ───────────────────────────────────────────────────────────────
function dragStart(e, itemId, tierId) {
  dragItem = itemId; dragFromTier = tierId;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => document.getElementById('item-' + itemId)?.classList.add('dragging'), 0);
}

function dragEnd(e) {
  document.querySelectorAll('.item-card').forEach(c => c.classList.remove('dragging','drag-over'));
  document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));
  dragItem = null; dragFromTier = null;
}

function dragOver(e, tierId) {
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
}

function dzOver(e, tierId) {
  e.preventDefault();
  document.getElementById('dz-' + tierId)?.classList.add('drag-over');
}

function drop(e, listId, tierId) {
  e.preventDefault();
  if (!dragItem) return;
  moveItem(listId, dragItem, tierId);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
load();
if (state.lists.length && !state.activeList) state.activeList = state.lists[0].id;
render();
</script>
</body>
</html>
